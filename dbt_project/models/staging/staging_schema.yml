version: 2

models:
  - name: stg_orders
    description: "Orders unified typing & naming"
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: purchase_ts
        tests: [not_null]

  - name: stg_customers
    description: "Customers basic reshape"
    columns:
      - name: customer_id
        tests: [not_null, unique]

  - name: stg_products
    description: "Products basic reshape"
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_order_payments
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_sequential
        tests: [not_null]
      - name: payment_type
        tests: [not_null]

  - name: stg_order_reviews
    columns:
      - name: review_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - not_null
