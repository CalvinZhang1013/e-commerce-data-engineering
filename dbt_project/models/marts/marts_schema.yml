version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]

  - name: dim_products
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: fact_orders
    columns:
      - name: order_item_id
        tests: [not_null]
      - name: customer_id
      - name: product_id

  - name: fact_payments
    columns:
      - name: order_id
  - name: fact_reviews
    columns:
      - name: order_id
  - name: dim_sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]
